
# Configuración del Servidor y Aplicación
spring.application.name=cibertec
server.port=8081

# Base de Datos (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/DB_HOTEL
spring.datasource.username=postgres
spring.datasource.password=p12345
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad (JWT)
jwt.secret=MiClaveSuperSeguraParaJWT2026HotelProyectoFinalCibertecSistemasSecurityKey
# Tiempo de expiración: 10 minutos (600,000 ms)
jwt.expiration=6000000

# Documentación (Swagger/OpenAPI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Configuración de Motor de Vistas (Thymeleaf)
spring.thymeleaf.check-template-location=false

# Logging (Depuración de SQL y Web)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG